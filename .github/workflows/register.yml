name: Bake the public-lot register

# Mount Auburn's Receiving Tomb, Public Lot and Crypt Register, as transcribed
# on FromThePage. Volunteers are still reviewing pages, so refresh monthly.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_register.py
      - scripts/parse_register.py
      - .github/workflows/register.yml
  schedule:
    - cron: '17 6 3 * *'

permissions:
  contents: write

concurrency:
  group: register
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the register
        run: python scripts/fetch_register.py
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/register.json data/register_log.txt
          git diff --cached --quiet || git commit -m "Bake the public-lot register"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

name: Probe sources (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e +o pipefail
          mkdir -p probe
          UA='Solstice/1.0 (https://github.com/samuelling/Solstice; Mount Auburn headstone app)'
          curl -sS -m 60 -A "$UA" https://fromthepage.com/robots.txt > probe/robots.txt
          curl -sS -m 60 -A "$UA" https://fromthepage.com/iiif/collection/mount-auburn-cemetery > probe/collection.json
          curl -sS -m 120 -A "$UA" -L https://fromthepage.com/iiif/32020886/export/plaintext/verbatim > probe/register1834.txt
          curl -sS -m 60 -A "$UA" -L https://fromthepage.com/iiif/32020886/manifest > probe/register1834_manifest.json
          ls -la probe > probe/ls.txt
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe output" && git pull --rebase --autostash -X theirs origin main && git push

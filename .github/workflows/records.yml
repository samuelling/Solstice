name: Refresh burial records

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_records.py
      - .github/workflows/records.yml
  schedule:
    - cron: '17 6 1 * *'   # monthly

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Mount Auburn burials from Wikidata and Wikipedia
        run: python scripts/fetch_records.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/burials.json
          git diff --cached --quiet || git commit -m "Refresh Mount Auburn burial records"
          git pull --rebase -X theirs origin main
          git push
